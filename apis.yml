name: Tab
description: >-
  Tab (tab.travel) is a London-based payment platform built specifically for
  independent tourism and hospitality businesses — hotels, hostels, tour
  operators, retreat centers and activity providers. It lets these merchants
  take card payments wherever their guests are, from in-advance deposits and
  online booking pages to in-person, on-the-move transactions via a mobile app,
  and to plug into an existing booking engine, PMS or OTA ecosystem. Tab
  natively handles 140+ currencies, pays out weekly in the merchant's local
  currency, and advertises transparent pricing from 2.9% per transaction with
  no hidden fees. Founded in 2015 by Mark Datta and backed by Y Combinator
  (W2015), Tab also operates a consumer-facing social-commerce guide for
  discovering and booking travel. This profile is maintained by the API
  Evangelist network; Tab does not currently publish a public developer API,
  SDKs or API documentation.
